        <h1>Phase Robotics: precision actuators and motors for robot hands</h1>
        <p>Phase Robotics builds small precision robotic actuators for robot hands and dexterous manipulators, and the machines that make them, starting with motor winding machines driven by our own servo drives.</p>
        <h2>Lunar Drive</h2>
        <p>A sensored FOC servo drive that turns any gimbal BLDC motor into a smart, daisy-chainable servo. USB in, 63-node CAN chain out.</p>
        <h2>Phalanx Drive</h2>
        <p>An integrated cycloidal actuator for dexterous robot joints: 11:1 reduction, phase-current FOC, FDCAN, inside a 24 mm by 32.5 mm package.</p>
        <h2>Winder-1</h2>
        <p>The machine that makes our actuators: a motor winding machine driven by the same drives it produces.</p>
        <p>Launching soon.</p>
